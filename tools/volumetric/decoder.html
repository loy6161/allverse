<script>
// ============================================================
// 1. フレームの読み取り（識別ストリップ）
// ============================================================

/** ストリップの高さの割合（仕様 §1） */
const STRIP = 1 / 45;
/** ストリップのブロック数（仕様 §2） */
const BLOCKS = 128;

/**
 * 識別ストリップを読む。
 * ⚠ 判定は「白か黒の二値」。グレー値ではないので、映像の圧縮で多少動いても壊れない（仕様 §2）
 */
function readStrip(source, w, h) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, w, h);
  // ストリップは**映像の上端**。画像座標では y が小さい側
  const y = Math.min(h - 1, Math.max(0, Math.floor((STRIP / 2) * h)));
  const line = ctx.getImageData(0, y, w, 1).data;
  const bits = [];
  for (let n = 0; n < BLOCKS; n += 1) {
    const x = Math.min(w - 1, Math.floor(((n + 0.5) / BLOCKS) * w));
    const i = x * 4;
    bits.push((line[i] + line[i + 1] + line[i + 2]) / 3 > 127.5 ? 1 : 0);
  }
  return bits;
}

/** LSB first で数値を取り出す（仕様 §2） */
function lsbFirst(bits, start, count) {
  let v = 0;
  for (let i = 0; i < count; i += 1) v |= bits[start + i] << i;
  return v >>> 0;
}

/**
 * ストリップの中身を意味のある形に直す。
 * ⚠ **ブロック0が1・ブロック1が0** でなければ無効。レンジは既定（−1〜1）に戻す（仕様 §2）
 */
function parseHeader(bits) {
  const valid = bits[0] === 1 && bits[1] === 0;
  const h = {
    valid,
    fourK: bits[2] === 1,
    split: bits[3] === 1 ? 2 : 1,
    subframe: bits[4],
    seq: lsbFirst(bits, 5, 5),
    rangeMin: [-1, -1, -1],
    rangeMax: [1, 1, 1],
  };
  if (!valid) return h;
  const v = [];
  for (let s = 0; s < 6; s += 1) {
    const q = lsbFirst(bits, 10 + 12 * s, 12);
    v.push((q / 4095) * 2 - 1); // 仕様 §2 の復号式
  }
  h.rangeMin = v.slice(0, 3);
  h.rangeMax = v.slice(3, 6);
  // ⚠ ストリップのレンジが**実際の切り詰めと合っていない**フレームがある
  //   （ドライバが送信マテリアルだけ更新して、ストリップには全域が載る等）。
  //   その場合は ?range=minX,minY,minZ,maxX,maxY,maxZ で手で入れて試せるようにしておく
  const forced = new URLSearchParams(location.search).get('range');
  if (forced) {
    const n = forced.split(',').map(Number);
    if (n.length === 6 && n.every(Number.isFinite)) {
      h.rangeMin = n.slice(0, 3);
      h.rangeMax = n.slice(3, 6);
      h.forced = true;
    }
  }
  return h;
}

// ============================================================
// 2. WebGL2 で再構成する
// ============================================================

const VS = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/**
 * 再構成のシェーダー。仕様 §3〜§6 をそのまま写している。
 * ⚠ 「判定できないビューは除外」ではなく **−1000 を返して必ず外にする**（仕様 §6）。
 *   除外すると形が変わる。
 */
const FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;

uniform sampler2D uFrame;
uniform vec3 uRangeMin;
uniform vec3 uRangeMax;
uniform float uColumns;   // 5（1枚）or 3（2枚分割）
uniform float uInset;
uniform int   uSteps;
uniform int   uRefine;
uniform float uTol;
uniform mat3  uRot;       // 見る向き
uniform float uDist;
uniform vec2  uRes;
uniform int   uShowRaw;
uniform float uEmpty;     // これ以上なら「この画素には何も無い」
uniform float uFixFlip;   // 1 なら Back/Left/Top の深度を反転して補う

const float STRIP = 1.0 / 45.0;

/** タイル（cell）の中の座標 → 画像のUV（仕様 §3） */
vec2 cellUvToImage(int cell, vec2 uv) {
  float usable = 1.0 - STRIP;
  float h = usable * 0.5;
  float col = mod(float(cell), uColumns);
  // cell 0.. は**上段**（色）。上段は y が大きい側
  float row = (float(cell) < uColumns) ? 1.0 : 0.0;
  // タイル端は読まない（隣のタイルやストリップが混ざる。仕様 §3）
  vec2 in01 = clamp(uv, 0.0, 1.0) * (1.0 - 2.0 * uInset) + uInset;
  float x = (col + in01.x) / uColumns;
  float y = (row > 0.5 ? h : 0.0) + in01.y * h;
  // ⚠ 仕様のUVは原点左下（Unity基準）。テクスチャは画像のまま（原点左上）入れているので、
  //   ここで y をひっくり返す。**アップロード時の反転には頼らない**
  return vec2(x, 1.0 - y);
}

/** ビュー番号 → 色のcell / 深度のcell（split=1のとき。仕様 §3） */
int colorCell(int view) { return view; }
int depthCell(int view) { return view + int(uColumns); }

/** volume座標 q → そのビューのUV（仕様 §5） */
vec2 viewUv(int view, vec3 q) {
  if (view == 0) return vec2( q.x,  q.y) * 0.5 + 0.5; // Front
  if (view == 1) return vec2(-q.x,  q.y) * 0.5 + 0.5; // Back
  if (view == 2) return vec2( q.z,  q.y) * 0.5 + 0.5; // Left
  if (view == 3) return vec2(-q.z,  q.y) * 0.5 + 0.5; // Right
  return vec2( q.x,  q.z) * 0.5 + 0.5;                // Top
}

/** volume座標 q → そのビューから見て「表面ならこの深度のはず」（仕様 §5） */
float expectedDepth(int view, vec3 q) {
  if (view == 0) return ( q.z + 1.0) * 0.5;
  if (view == 1) return (1.0 - q.z ) * 0.5;
  if (view == 2) return (1.0 - q.x ) * 0.5;
  if (view == 3) return ( q.x + 1.0) * 0.5;
  return (1.0 - q.y ) * 0.5;
}

/**
 * タイルの切り詰めの逆算（仕様 §5）。
 * ⚠ 各タイルは2mの枠全体ではなく、**被写体の箱の範囲だけ**を引き伸ばして入れている。
 *   RangeMin/Max が全域でない限り、これを戻さないと絵がずれる
 */
void viewRect(int view, out vec2 lo, out vec2 hi) {
  vec3 l = (uRangeMin + 1.0) * 0.5;
  vec3 h = (uRangeMax + 1.0) * 0.5;
  if (view == 0) { lo = vec2(l.x, l.y); hi = vec2(h.x, h.y); }
  else if (view == 1) { lo = vec2(1.0 - h.x, l.y); hi = vec2(1.0 - l.x, h.y); }
  else if (view == 2) { lo = vec2(l.z, l.y); hi = vec2(h.z, h.y); }
  else if (view == 3) { lo = vec2(1.0 - h.z, l.y); hi = vec2(1.0 - l.z, h.y); }
  else { lo = vec2(l.x, l.z); hi = vec2(h.x, h.z); }
}

/** ビューUV → タイルの中の座標（切り詰めを戻す） */
vec2 toCellUv(int view, vec2 uv) {
  vec2 lo, hi;
  viewRect(view, lo, hi);
  return (uv - lo) / max(hi - lo, vec2(1e-3));
}

/** どの軸を測っているか（仕様 §4） */
int viewAxis(int view) {
  if (view == 0 || view == 1) return 2; // z
  if (view == 2 || view == 3) return 0; // x
  return 1;                              // y
}
bool viewFlipped(int view) { return view == 1 || view == 2 || view == 4; }

/**
 * 深度を読む。返り値が 1.5 なら「この画素には何も無い」（仕様 §4）
 */
float readDepth(int view, vec2 uv) {
  vec2 cu = toCellUv(view, uv);
  if (any(lessThan(cu, vec2(0.0))) || any(greaterThan(cu, vec2(1.0)))) return 1.5;
  vec2 img = cellUvToImage(depthCell(view), cu);
  float p = texture(uFrame, img).r;
  // 「何も無い」の印（仕様では 1.0、判定は 0.995）。
  // ⚠ **映像の圧縮が強いと、この 1.0 が落ちてくる**（2026-08-08 実測：
  //   チャット経由で圧縮された素材では白が 0.965 まで落ち、空白が「奥の面」として
  //   拾われて箱が真っ黒に塗り潰された）。素材に合わせて下げられるようにしてある
  if (p >= uEmpty) return 1.5;
  int ax = viewAxis(view);
  // ⚠ `uRangeMin[ax]` のような**添字が変わる読み方は避ける**。環境によって値が壊れる。
  //   成分は if で選ぶ（2026-08-08）
  float lo = ax == 0 ? uRangeMin.x : (ax == 1 ? uRangeMin.y : uRangeMin.z);
  float hi = ax == 0 ? uRangeMax.x : (ax == 1 ? uRangeMax.y : uRangeMax.z);
  float a = (lo + 1.0) * 0.5;
  float b = (hi + 1.0) * 0.5;
  if (viewFlipped(view)) { float t = 1.0 - b; b = 1.0 - a; a = t; }
  float n = clamp((p - 0.02) / (0.98 - 0.02), 0.0, 1.0);
  // ⚠⚠ **深度が全方向で逆向きに入っているフレームがある**（2026-08-08 実測）。
  //   仕様は「近い＝小さい値」だが、もらったフレームは「近い＝大きい値」だった。
  //   そのままだと Front から見た表面と Back から見た表面が**すれ違って交わらず**、
  //   立体が1画素も出ない。ここでまとめて向きを直せるようにしてある。
  //   （数値で確かめた例: Front の最も手前が z=+0.28、Back の最も手前が z=−0.29。
  //     人物は両方の内側にいるはずなのに、互いに「そこには無い」と言っていた）
  if (uFixFlip > 0.5) n = 1.0 - n;
  return a + n * max(b - a, 1e-4);
}

/**
 * その点が被写体の内側か（仕様 §6）。
 * 5方向の符号の**最小値**が 0 以上なら内側
 */
float insideSign(vec3 q) {
  float m = 1e9;
  for (int v = 0; v < 5; v += 1) {
    vec2 uv = viewUv(v, q);
    float s;
    if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) {
      s = -1000.0;
    } else {
      float d = readDepth(v, uv);
      if (d > 1.0) s = -1000.0;             // 何も無い
      else s = expectedDepth(v, q) - d;
    }
    m = min(m, s);
  }
  return m;
}

/** 表面の色。見えているビューから取る。5方向の平均はしない（にじむため。仕様 §6） */
vec3 surfaceColor(vec3 q, vec3 rayDir) {
  float bestW = -1.0;
  vec3 best = vec3(0.5);
  vec3 normals[5];
  normals[0] = vec3(0.0, 0.0, 1.0);
  normals[1] = vec3(0.0, 0.0, -1.0);
  normals[2] = vec3(-1.0, 0.0, 0.0);
  normals[3] = vec3(1.0, 0.0, 0.0);
  normals[4] = vec3(0.0, 1.0, 0.0);
  for (int v = 0; v < 5; v += 1) {
    vec2 uv = viewUv(v, q);
    if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) continue;
    float d = readDepth(v, uv);
    if (d > 1.0) continue;
    if (abs(expectedDepth(v, q) - d) > uTol) continue;
    float w = dot(-rayDir, normals[v]);
    if (w <= bestW) continue;
    vec2 cu = toCellUv(v, uv);
    if (any(lessThan(cu, vec2(0.0))) || any(greaterThan(cu, vec2(1.0)))) continue;
    bestW = w;
    best = texture(uFrame, cellUvToImage(colorCell(v), cu)).rgb;
  }
  return best;
}

/** 箱との交差 */
bool boxHit(vec3 ro, vec3 rd, vec3 lo, vec3 hi, out float t0, out float t1) {
  vec3 inv = 1.0 / rd;
  vec3 a = (lo - ro) * inv;
  vec3 b = (hi - ro) * inv;
  vec3 mn = min(a, b), mx = max(a, b);
  t0 = max(max(mn.x, mn.y), mn.z);
  t1 = min(min(mx.x, mx.y), mx.z);
  return t1 > max(t0, 0.0);
}

void main() {
  if (uShowRaw == 1) {
    frag = vec4(texture(uFrame, vUv).rgb, 1.0);
    return;
  }
  // 読み取りが合っているかを見るモード。Front の深度をそのまま出す
  // （人の形が出れば、タイルの位置と深度の復号は正しい）
  // 読み取りの確認用。5方向の深度を横に並べて出す
  // （人の形が出れば、タイルの位置・向き・深度の復号がすべて正しい）
  if (uShowRaw == 2) {
    int v = int(floor(vUv.x * 5.0));
    vec2 t = vec2(fract(vUv.x * 5.0), vUv.y);
    vec3 q = vec3(t * 2.0 - 1.0, 0.0);
    float d = readDepth(v, viewUv(v, q));
    if (d > 1.0) { frag = vec4(0.0, 0.15, 0.25, 1.0); return; } // 「何も無い」は青
    frag = vec4(vec3(d), 1.0);
    return;
  }
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  vec3 ro = uRot * vec3(0.0, 0.0, uDist);
  vec3 rd = normalize(uRot * normalize(vec3(p, -1.6)));

  // レイマーチの箱は RangeMin/Max でも絞る（仕様 §6）
  vec3 lo = max(uRangeMin, vec3(-1.0));
  vec3 hi = min(uRangeMax, vec3(1.0));
  float t0, t1;
  if (!boxHit(ro, rd, lo, hi, t0, t1)) { frag = vec4(0.02, 0.03, 0.06, 1.0); return; }
  t0 = max(t0, 0.0);

  float dt = (t1 - t0) / float(uSteps);
  float t = t0;
  bool hit = false;
  float tPrev = t0;
  for (int i = 0; i < 512; i += 1) {
    if (i >= uSteps) break;
    vec3 q = ro + rd * t;
    if (insideSign(q) >= 0.0) { hit = true; break; }
    tPrev = t;
    t += dt;
  }
  if (!hit) { frag = vec4(0.02, 0.03, 0.06, 1.0); return; }

  // 二分探索で表面を詰める
  float a = tPrev, b = t;
  for (int i = 0; i < 8; i += 1) {
    if (i >= uRefine) break;
    float m = (a + b) * 0.5;
    if (insideSign(ro + rd * m) >= 0.0) b = m; else a = m;
  }
  vec3 q = ro + rd * b;
  frag = vec4(surfaceColor(q, rd), 1.0);
}`;

// ---- WebGL の下ごしらえ ----------------------------------------------------

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false });
const errEl = document.getElementById('err');
if (!gl) errEl.textContent = 'WebGL2 が使えません。';

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) || 'compile failed');
  }
  return s;
}

let prog = null;
try {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || 'link failed');
  }
} catch (e) {
  errEl.textContent = String(e.message || e);
}

if (prog) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
// ⚠ フレームは**データ**なので、拡大縮小でにじませない（仕様 §8-3 も Point が正しいと言っている）
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
// 画像が入るまでの仮の中身（1x1の白）。これが読めなければ、そもそもテクスチャが見えていない
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
  new Uint8Array([255, 255, 255, 255]));

const U = {};
for (const n of ['uFrame', 'uRangeMin', 'uRangeMax', 'uColumns', 'uInset', 'uSteps',
  'uRefine', 'uTol', 'uRot', 'uDist', 'uRes', 'uShowRaw', 'uEmpty', 'uFixFlip']) {
  U[n] = prog ? gl.getUniformLocation(prog, n) : null;
}

// ---- 状態 ------------------------------------------------------------------

let header = { valid: false, split: 1, rangeMin: [-1, -1, -1], rangeMax: [1, 1, 1], seq: 0, fourK: true, subframe: 0 };
let yaw = 0;
let pitch = 0;
let dist = 2.6;
// 0=立体 / 1=元の絵 / 2=深度の確認。?mode=raw / ?mode=depth で最初から切り替えられる
let showRaw = ({ raw: 1, depth: 2 })[new URLSearchParams(location.search).get('mode')] || 0;
let videoEl = null;
let frames = 0;
let lastFpsAt = performance.now();

function setHeaderTable() {
  const rows = [
    ['sync', header.valid ? '<span class="ok">OK</span>' : '<span class="ng">NG</span>'],
    ['プロファイル', header.fourK ? '4K' : '1080p'],
    ['split', header.split === 2 ? '2枚' : '1枚'],
    ['サブフレーム', header.subframe],
    ['シーケンス', header.seq],
    ['RangeMin', header.rangeMin.map((v) => v.toFixed(2)).join(', ')],
    ['RangeMax', header.rangeMax.map((v) => v.toFixed(2)).join(', ')],
    ['レンジ', header.forced ? '<span class="ng">手で指定</span>' : 'ストリップの値'],
  ];
  document.querySelector('#hdr tbody').innerHTML = rows
    .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

/** 画像／動画をテクスチャに入れて、ストリップを読み直す */
function useSource(src, w, h) {
  // ⚠ **RGBA で入れる**（2026-08-08）。WebGL2 で internalformat に gl.RGB を渡すと、
  //   環境によってテクスチャが不完全になり、シェーダーからは**真っ黒**に見えた
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // ⚠ **UNPACK_FLIP_Y_WEBGL には頼らない**（2026-08-08）。
  //   環境によって効かず、深度タイルのつもりで色タイルを読んでいた（＝真っ黒）。
  //   向きはシェーダー側で合わせる（cellUvToImage の最後で反転している）
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  const bits = readStrip(src, w, h);
  header = parseHeader(bits);
  setHeaderTable();
  errEl.textContent = header.valid ? '' : 'ストリップが読めません（sync が立っていない）。上下が逆か、別の映像かもしれません。';
}

function loadImage(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    if (videoEl) { videoEl.pause(); videoEl = null; }
    useSource(img, img.naturalWidth, img.naturalHeight);
  };
  img.onerror = () => { errEl.textContent = '画像を読み込めませんでした: ' + url; };
  img.src = url;
}

function loadVideo(url) {
  const v = document.createElement('video');
  v.crossOrigin = 'anonymous';
  v.loop = true;
  v.muted = true;
  v.playsInline = true;
  v.src = url;
  v.addEventListener('loadeddata', () => {
    videoEl = v;
    v.play().catch(() => {});
  });
  v.onerror = () => { errEl.textContent = '動画を読み込めませんでした。'; };
}

// ---- 操作 ------------------------------------------------------------------

let dragging = false;
let lastX = 0;
let lastY = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.008;
  pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - lastY) * 0.008));
  lastX = e.clientX;
  lastY = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.max(1.2, Math.min(6, dist + e.deltaY * 0.002));
}, { passive: false });

document.getElementById('reset').addEventListener('click', () => { yaw = 0; pitch = 0; dist = 2.6; });
document.getElementById('raw').addEventListener('click', (e) => {
  showRaw = (showRaw + 1) % 3;
  e.target.textContent = ['元の絵を見る', '深度を見る', '立体を見る'][showRaw];
});
document.getElementById('sample').addEventListener('change', (e) => loadImage(e.target.value));
document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  if (f.type.startsWith('video/')) loadVideo(url);
  else loadImage(url);
});

const sliders = { steps: 'stepsV', refine: 'refineV', tol: 'tolV', inset: 'insetV', empty: 'emptyV' };
for (const id of Object.keys(sliders)) {
  const el = document.getElementById(id);
  const out = document.getElementById(sliders[id]);
  const show = () => { out.textContent = el.value; };
  el.addEventListener('input', show);
  show();
}

// ---- 毎フレーム ------------------------------------------------------------

function rotMat(y, p) {
  const cy = Math.cos(y), sy = Math.sin(y), cp = Math.cos(p), sp = Math.sin(p);
  // Y回転 × X回転（列優先で渡す）
  return new Float32Array([
    cy, 0, -sy,
    sy * sp, cp, cy * sp,
    sy * cp, -sp, cy * cp,
  ]);
}

function frame() {
  requestAnimationFrame(frame);
  if (!prog) return;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  if (videoEl && videoEl.readyState >= 2) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoEl);
  }
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.uFrame, 0);
  gl.uniform3fv(U.uRangeMin, header.rangeMin);
  gl.uniform3fv(U.uRangeMax, header.rangeMax);
  gl.uniform1f(U.uColumns, header.split === 2 ? 3 : 5);
  gl.uniform1f(U.uInset, parseFloat(document.getElementById('inset').value));
  gl.uniform1i(U.uSteps, parseInt(document.getElementById('steps').value, 10));
  gl.uniform1i(U.uRefine, parseInt(document.getElementById('refine').value, 10));
  gl.uniform1f(U.uTol, parseFloat(document.getElementById('tol').value));
  gl.uniformMatrix3fv(U.uRot, false, rotMat(yaw, pitch));
  gl.uniform1f(U.uDist, dist);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform1i(U.uShowRaw, showRaw);
  gl.uniform1f(U.uEmpty, parseFloat(document.getElementById('empty').value));
  gl.uniform1f(U.uFixFlip, document.getElementById('fixflip').checked ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames += 1;
  const now = performance.now();
  if (now - lastFpsAt > 1000) {
    document.getElementById('fps').textContent = `${Math.round((frames * 1000) / (now - lastFpsAt))} fps`;
    frames = 0;
    lastFpsAt = now;
  }
}
frame();
loadImage('samples/frame1.jpg');
</script>
</body>
</html>
